apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-app
  labels:
    app: flask-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flask-app
  template:
    metadata:
      labels:
        app: flask-app
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "flask-app-role"
        vault.hashicorp.com/agent-inject-secret-api-key: "secret/data/weather-app/config"
        vault.hashicorp.com/agent-inject-template-api-key: |
          {{- with secret "secret/dataweather-app/config" -}}
          export WEATHER_API_KEY="{{ .Data.data.api_key }}"
          {{- end }}
      #   vault.hashicorp.com/tls-skip-verify: "true" 
    spec:
      serviceAccountName: flask-service-account
      containers:
        - name: flask-container
          image: dubithal/k8s-weather-app:latest 
          ports:
            - containerPort: 5000
          command: ["sh", "-c"]
          args:
            - ". /vault/secrets/api-key && exec python app.py"
          resources:
            requests:
              cpu: "100m"
            limits:
              cpu: "500m"
